<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weightlifting App</title>
    <meta name="description" content="Weightlifting App - Gerencie seus treinos de musculação de forma simples e rápida. Acompanhe cargas, séries e repetições direto no seu celular.">
    <meta name="keywords" content="musculação, treino, academia, weightlifting, fitness, tracker de exercícios, PWA, ADS, Angelo Mascarenhas">
    <meta name="author" content="Angelo Mascarenhas">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-title" content="Weightlifting App">
    <link rel="icon" href="img/192.png" sizes="192x192" type="image/png">
    <link rel="icon" href="img/512.png" sizes="512x512" type="image/png">
    <link rel="apple-touch-icon" href="img/192.png">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

</head>
<body>
    <header>
        <h1>Weightlifting App</h1>
    </header>

    <main>
        <section id="form-section">
            <h3>Novo Exercício</h3>
            <form id="exercicio-form">
                <input type="hidden" id="exercicio-id">
                <input type="text" id="nome" placeholder="Nome do exercício (ex: Supino)" required>
                <input type="text" id="grupoMuscular" placeholder="Grupo Muscular" required>
                <div class="row">
                    <input type="number" id="series" placeholder="Séries" required>
                    <input type="number" id="repeticoes" placeholder="Reps" required>
                </div>
                <input type="number" id="carga" placeholder="Carga (kg)" required>
                <button type="submit" id="btn-salvar">Salvar Treino</button>
            </form>
        </section>

        <hr>

        <section id="lista-section">
            <h3>Meus Exercícios</h3>
            <div id="lista-exercicios">
                <p>Carregando treinos...</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
